<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#000000">
<title>Dima's Road to Brasov</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect x=%222%22 y=%226%22 width=%2212%22 height=%228%22 fill=%22%23fc98b8%22/><rect x=%227%22 y=%222%22 width=%222%22 height=%224%22 fill=%22%23fcd000%22/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="pad-left" class="pad">
    <div id="dpad">
      <button data-key="up" class="d up" type="button" aria-label="up"></button>
      <button data-key="left" class="d left" type="button" aria-label="left"></button>
      <button data-key="right" class="d right" type="button" aria-label="right"></button>
      <button data-key="down" class="d down" type="button" aria-label="down"></button>
      <span class="d center"></span>
    </div>
  </div>

  <div id="screen">
   <div id="stage">
    <canvas id="game" width="256" height="240"></canvas>
    <div id="prize" class="hidden">
      <div id="qr"></div>
      <a id="claim" href="#" target="_blank" rel="noopener">CLAIM</a>
      <p id="prize-note">Scan the code or tap the button</p>
    </div>
   </div>
  </div>

  <div id="pad-right" class="pad">
    <div id="mid">
      <div class="pill-wrap"><button id="mute" class="pill" type="button" aria-label="sound"></button><span class="lbl">SOUND</span></div>
      <div class="pill-wrap"><button data-key="start" class="pill" type="button" aria-label="start"></button><span class="lbl">START</span></div>
    </div>
    <div id="ab">
      <button data-key="a" class="btn a" type="button" aria-label="A"></button>
      <span class="lbl">A</span>
    </div>
  </div>

  <div id="rotate"><div class="phone"></div><p>ROTATE YOUR PHONE</p></div>

  <p id="hint">ARROWS move &middot; SPACE / Z = A (jump, ok, sword) &middot; ENTER = menu (restart) &middot; <span id="mute-key">M = sound: on</span></p>
</div>

<script src="vendor/qrcode.js"></script>
<script src="js/config.js"></script>
<script src="js/font.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/engine.js"></script>
<script src="js/platformer.js"></script>
<script src="js/levels/level1.js"></script>
<script src="js/levels/level2.js"></script>
<script src="js/levels/level3.js"></script>
<script src="js/levels/level4.js"></script>
<script src="js/levels/level5.js"></script>
<script src="js/levels/final.js"></script>
<script src="js/main.js"></script>
</body>
</html>
